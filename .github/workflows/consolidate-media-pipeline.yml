name: Consolidate media pipeline

on:
  push:
    branches: [merge/media-pipeline]
    paths:
      - ".github/workflows/consolidate-media-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: merge/media-pipeline
          fetch-depth: 0

      - name: Clone source repositories
        run: |
          rm -rf /tmp/medias_bias /tmp/buildlaw /tmp/ppl_wiki_twits
          git clone --depth 1 https://github.com/AlexArutiunian/medias_bias.git /tmp/medias_bias
          git clone --depth 1 https://github.com/AlexArutiunian/collect-analysis_BuildLaw.git /tmp/buildlaw
          git clone --depth 1 https://github.com/AlexArutiunian/ppl_wiki_twits.git /tmp/ppl_wiki_twits

      - name: Organize existing media dataset
        run: |
          mkdir -p pipelines/wikipedia data/media logs

          if [ -f main.py ]; then
            git mv main.py pipelines/wikipedia/scrape_media_wikipedia.py
          fi

          for f in data.json data_.json merge_res.json output.json wiki.zip; do
            if [ -e "$f" ]; then
              git mv "$f" "data/media/$f"
            fi
          done

          if [ -f log.txt ]; then
            git mv log.txt logs/wiki_scrape.log
          fi

      - name: Import media parsing notebooks
        run: |
          mkdir -p pipelines/media notebooks/analysis docs/source_readmes
          cp /tmp/medias_bias/parc_medias.ipynb pipelines/media/parc_medias.ipynb
          cp /tmp/medias_bias/parc_arts_medias.ipynb pipelines/media/parc_arts_medias.ipynb
          cp /tmp/medias_bias/parc_arts_allsides.ipynb pipelines/media/parc_arts_allsides.ipynb
          cp /tmp/buildlaw/build_analysis.ipynb notebooks/analysis/build_law_analysis.ipynb
          cp /tmp/medias_bias/README.md docs/source_readmes/medias_bias.md
          cp /tmp/buildlaw/README.md docs/source_readmes/collect-analysis_BuildLaw.md

      - name: Import people and Wikipedia pipeline
        run: |
          mkdir -p pipelines/people data/people/mbf45 data/people/statistics data/people/mappings docs/source_readmes

          cp /tmp/ppl_wiki_twits/main.py pipelines/people/normalize_occupations.py
          cp /tmp/ppl_wiki_twits/parc_wiki.py pipelines/people/scrape_people_wikipedia.py
          cp /tmp/ppl_wiki_twits/statistics.py analysis/occupation_statistics.py

          cp /tmp/ppl_wiki_twits/occupations.json data/people/occupations.json
          cp /tmp/ppl_wiki_twits/mbf45/datas.json data/people/mbf45/datas.json
          rm -rf data/people/bunchs
          cp -r /tmp/ppl_wiki_twits/bunchs data/people/bunchs

          cp /tmp/ppl_wiki_twits/stat_.xlsx data/people/statistics/stat_.xlsx
          cp /tmp/ppl_wiki_twits/occup_stat.xlsx data/people/statistics/occup_stat.xlsx
          cp /tmp/ppl_wiki_twits/to_replace.xlsx data/people/mappings/to_replace.xlsx
          cp /tmp/ppl_wiki_twits/README.md docs/source_readmes/ppl_wiki_twits.md

      - name: Generate statistics and figures
        run: |
          python -m pip install --upgrade pip
          python -m pip install matplotlib
          python analysis/generate_summary.py

      - name: Commit consolidated repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "merge political media projects"
          git push origin HEAD:merge/media-pipeline
